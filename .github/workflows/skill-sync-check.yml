name: Skill Sync Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "skills/**"
      - "workflows/**"
      - "scripts/sync-check.sh"
      - "scripts/sync.mjs"
      - "SYNC_WORKFLOW.md"
      - "prompts/**"
      - "evals/**"
      - "tests/**"
      - "package.json"
      - "VOCABULARY_SYNC.md"
      - ".github/workflows/skill-sync-check.yml"
      - ".github/scripts/upsert-issue.js"

permissions:
  contents: read
  issues: write

concurrency:
  group: skill-sync-check
  cancel-in-progress: true

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accessibility-skills
        uses: actions/checkout@v4
        with:
          path: accessibility-skills
          fetch-depth: 0

      - name: Check out mgifford/ACCESSIBILITY.md
        uses: actions/checkout@v4
        with:
          repository: mgifford/ACCESSIBILITY.md
          path: ACCESSIBILITY.md
          fetch-depth: 0

      - name: Run sync check
        id: sync_check
        working-directory: accessibility-skills
        env:
          ACCESSIBILITY_MD_DIR: ${{ github.workspace }}/ACCESSIBILITY.md
        run: |
          set +e
          ./scripts/sync-check.sh > /tmp/sync-check-output.txt 2>&1
          code=$?
          set -e
          cat /tmp/sync-check-output.txt
          if [ "$code" -eq 1 ]; then
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "has_error=true" >> "$GITHUB_OUTPUT"
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shared vocabulary sync check
        id: vocab_check
        working-directory: accessibility-skills
        env:
          ACCESSIBILITY_MD_DIR: ${{ github.workspace }}/ACCESSIBILITY.md
        run: |
          set +e
          ./scripts/sync-check.sh --vocab > /tmp/vocab-check-output.txt 2>&1
          code=$?
          set -e
          cat /tmp/vocab-check-output.txt
          if [ "$code" -eq 1 ]; then
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "has_error=true" >> "$GITHUB_OUTPUT"
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update skill sync issue
        if: steps.sync_check.outputs.has_review == 'true'
        uses: actions/github-script@v7
        env:
          SYNC_REPORT_PATH: /tmp/sync-check-output.txt
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/accessibility-skills/.github/scripts/upsert-issue.js';
            const { upsertIssue } = require(path);
            const report = fs.readFileSync(process.env.SYNC_REPORT_PATH, 'utf8');
            const body = [
              'The sync check found a skill whose canonical source changed, an external review that is due, or a configuration problem.',
              '',
              '```',
              report,
              '```',
              '',
              'To resolve:',
              '1. Review the canonical diff shown in the report and update `skills/<name>/SKILL.md` only where needed.',
              '2. Record the decision with `npm run sync:review -- --skill <name> --decision <update|no-update|divergence|defer> --note "..."`.',
              '3. Do not copy the full canonical guide over the distilled skill.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const result = await upsertIssue({
              github,
              context,
              label: 'skill-sync-drift',
              title: 'Skill sync needs review',
              report,
              body,
              labelDescription: 'Tracks skill synchronization with mgifford/ACCESSIBILITY.md',
            });
            console.log(JSON.stringify(result));

      - name: Open or update vocabulary sync issue
        if: steps.vocab_check.outputs.has_review == 'true'
        uses: actions/github-script@v7
        env:
          VOCAB_REPORT_PATH: /tmp/vocab-check-output.txt
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/accessibility-skills/.github/scripts/upsert-issue.js';
            const { upsertIssue } = require(path);
            const report = fs.readFileSync(process.env.VOCAB_REPORT_PATH, 'utf8');
            const body = [
              'The shared-vocabulary check found a source that changed since its recorded sync point.',
              '',
              '```',
              report,
              '```',
              '',
              'To resolve:',
              '1. Review the diff for every consumer listed in `VOCABULARY_SYNC.md`, not only the first one.',
              '2. Update the affected `SKILL.md` files and their own `SYNC.md` metadata.',
              '3. Update the recorded commit in `VOCABULARY_SYNC.md` only after every consumer has been reviewed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const result = await upsertIssue({
              github,
              context,
              label: 'vocabulary-sync-drift',
              title: 'Shared vocabulary sync needs review',
              report,
              body,
              labelDescription: 'Tracks shared finding-vocabulary synchronization with mgifford/ACCESSIBILITY.md',
            });
            console.log(JSON.stringify(result));

      - name: Generate machine-readable report
        if: always()
        working-directory: accessibility-skills
        env:
          ACCESSIBILITY_MD_DIR: ${{ github.workspace }}/ACCESSIBILITY.md
        run: |
          node scripts/sync.mjs report --format json --output /tmp/sync-report.json || true

      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-skills-sync-report
          path: /tmp/sync-report.json
          if-no-files-found: ignore

      - name: Fail when review or repair is required
        if: steps.sync_check.outputs.has_review == 'true' || steps.vocab_check.outputs.has_review == 'true'
        run: |
          echo "Sync review is required. See the issue opened or updated by this run."
          exit 1
